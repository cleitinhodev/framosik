name: Verify offline tutorial
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', 'build_tools/*tutorial.py', '.github/workflows/guide.yml']
  pull_request:
    paths:
      - 'docs/**'
      - 'build_tools/*tutorial.py'
      - i18n.py
      - app_info.py
permissions:
  contents: read
jobs:
  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements.txt Pillow numpy opencv-python-headless playwright
      - run: python build_tools/build_tutorial.py
      - run: python build_tools/check_tutorial.py dist/Framosik-Tutorial.html --screens dist/guide-preview
      - uses: actions/upload-artifact@v4
        with:
          name: Framosik-Guide
          path: dist/Framosik-Tutorial.html
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Guide-preview
          path: dist/guide-preview
          if-no-files-found: error
