name: Publish style beta
on:
  push:
    branches: [estilo]
    paths: [app_info.py]
permissions:
  contents: write
jobs:
  windows:
    uses: ./.github/workflows/release.yml
  linux:
    uses: ./.github/workflows/linux.yml
  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish beta from the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python -c 'from app_info import VERSION; print(VERSION)')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          prefix="Framosik-$version"
          (cd packages && sha256sum -c "$prefix-Linux-x86_64.tar.gz.sha256")
          files=("packages/$prefix-Windows-x64.zip" "packages/$prefix-Linux-x86_64.tar.gz"
                 "packages/$prefix-Linux-x86_64.tar.gz.sha256" "packages/$prefix-aparencia.gif")
          for file in "${files[@]}"; do test -s "$file"; done
          if [[ "$version" == "0.5.0-beta.1" ]]; then
            gh release edit v0.4.1 --prerelease=false --latest
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Framosik v$version · Estilo" --notes-file RELEASE_NOTES.md "${files[@]}"
