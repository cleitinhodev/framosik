name: Windows build and release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pyinstaller==6.22.3
      - name: Test algorithm and UI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
      - name: Build and smoke-test Windows executable
        run: python build_tools/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Framosik-Windows-x64
          path: dist/Framosik-0.3.0-Windows-x64.zip
      - name: Attach executable to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" dist/Framosik-0.3.0-Windows-x64.zip
