name: Linux build and release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux.yml'
      - 'build_tools/build_linux.py'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        default: v0.3.0
permissions:
  contents: write
concurrency:
  group: linux-release-${{ inputs.tag || github.event.release.tag_name || 'v0.3.0' }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || 'v0.3.0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: release-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: release-source/requirements.txt
      - name: Install Linux graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1
      - name: Install Python dependencies
        run: python -m pip install -r release-source/requirements.txt pytest pyinstaller==6.22.3
      - name: Test algorithm and interface
        working-directory: release-source
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
      - name: Build, extract and smoke-test Linux executable
        run: python build_tools/build_linux.py --source release-source
      - uses: actions/upload-artifact@v4
        with:
          name: Framosik-Linux-x86_64
          path: |
            release-source/dist/*.tar.gz
            release-source/dist/*.sha256
          if-no-files-found: error
      - name: Attach Linux package and checksum to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-source/dist/*.tar.gz release-source/dist/*.sha256
